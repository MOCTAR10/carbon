# nginx vhost for CarbonTrack (Next.js)
# Copy to /etc/nginx/sites-available/carbontrack and enable with:
#   sudo ln -sf /etc/nginx/sites-available/carbontrack /etc/nginx/sites-enabled/carbontrack
#   sudo nginx -t && sudo systemctl reload nginx
#
# Once DNS for carbontrack.greenleaves.ga points to 37.60.240.199,
# you can also run:
#   sudo certbot --nginx -d carbontrack.greenleaves.ga
# which will automatically inject the SSL block + a :80 → :443 redirect.

upstream carbontrack_app {
    server 127.0.0.1:3000;
    keepalive 32;
}

server {
    # Public port on the shared server (matches other apps' 8081-8083 pattern)
    # When DNS for carbontrack.greenleaves.ga is set up, certbot can rewrite this
    # to listen 80 + 443 with proper hostname routing.
    listen 8084;
    listen [::]:8084;
    server_name carbontrack.greenleaves.ga 37.60.240.199 _;

    # Match the Next.js dev memory cap so big PDF uploads succeed
    client_max_body_size 25M;
    client_body_buffer_size 256k;
    proxy_buffering on;

    # Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_types
        text/plain
        text/css
        text/javascript
        text/xml
        application/json
        application/javascript
        application/xml
        application/xml+rss
        application/atom+xml
        image/svg+xml;

    # Security headers (basic — extend as needed)
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Next.js hashed static assets — long cache, immutable
    location /_next/static/ {
        proxy_pass http://carbontrack_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_cache_valid 200 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # Public folder assets (uploads, logos) — moderate cache
    location /uploads/ {
        proxy_pass http://carbontrack_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=86400" always;
        # User-supplied files: never sniff, never execute (a location add_header drops server-level headers)
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Security-Policy "default-src 'none'; img-src 'self'; style-src 'unsafe-inline'; sandbox" always;
    }

    # Company logos — moderate cache
    location /logos/ {
        proxy_pass http://carbontrack_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=86400" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Security-Policy "default-src 'none'; img-src 'self'; style-src 'unsafe-inline'; sandbox" always;
    }

    # API routes — never cache, allow long-running PDF gen
    location /api/ {
        proxy_pass http://carbontrack_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # Everything else — pass to Next.js (it handles SSR + WebSocket HMR)
    location / {
        proxy_pass http://carbontrack_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
    }

    access_log /var/log/nginx/carbontrack.access.log;
    error_log  /var/log/nginx/carbontrack.error.log warn;
}
